services:
  # Backend FastAPI service
  - type: web
    name: hospital-pulse-backend
    runtime: python
    repo: https://github.com/ByteQuest-2025/GFGBQ-Team-hopx
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://hospital-pulse-frontend.onrender.com
      - key: OPENAI_API_KEY
        value: dummy_key_for_now
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  # Frontend static site
  - type: web
    name: hospital-pulse-frontend
    runtime: static
    repo: https://github.com/ByteQuest-2025/GFGBQ-Team-hopx
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://hospital-pulse-backend.onrender.com
